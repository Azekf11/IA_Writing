name: Frontend

on:
  push:
    branches: [main]
    # Besides the app: every file outside frontend/ that its unit tests read
    paths:
      - "frontend/**"
      - ".github/**"
      - "docs/research/comparison-texts.json"
      - "supabase/tests/local-stack.mjs"
      - "supabase/migrations/**"
      - "corpus-pipeline/uv.lock"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/**"
      - "docs/research/comparison-texts.json"
      - "supabase/tests/local-stack.mjs"
      - "supabase/migrations/**"
      - "corpus-pipeline/uv.lock"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      # Far from UTC, the runner's own zone, where a local day or a local midnight taken for the UTC
      # one would pass
      - run: npm test
        env:
          TZ: Asia/Tokyo
      # Placeholder values: the build never talks to Supabase or Claude
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      # Browser tests mock the API, so no secrets are needed
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The traces and screenshots of the tests that failed
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: frontend/test-results/
          retention-days: 7
