name: Database

on:
  push:
    branches: [main]
    # quota.test.mjs runs the route's own quota calls against the functions in the migrations
    paths:
      - "supabase/**"
      - "frontend/lib/rewrite/quota.ts"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "frontend/lib/rewrite/quota.ts"
      - ".github/workflows/database.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      # A throwaway stack on the runner: every migration from scratch, no secret, no model
      - run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,postgres-meta,supavisor
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-concurrency=1 'supabase/tests/*.test.mjs'
