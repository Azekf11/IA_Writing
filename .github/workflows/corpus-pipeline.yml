name: Corpus pipeline

on:
  push:
    branches: [main]
    # The embedder and the fixture live with the app, and a test here checks them against each other
    paths:
      - "corpus-pipeline/**"
      - "frontend/data/embedder/**"
      - "frontend/tests/fixtures/embedder-parity.json"
      - ".github/workflows/corpus-pipeline.yml"
  pull_request:
    paths:
      - "corpus-pipeline/**"
      - "frontend/data/embedder/**"
      - "frontend/tests/fixtures/embedder-parity.json"
      - ".github/workflows/corpus-pipeline.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: corpus-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: corpus-pipeline/uv.lock
      - run: uv sync --group dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
