[project]
# "aiwd" is the package's original name, from the detector research it started with
name = "aiwd"
version = "0.1.0"
description = "Offline pipeline that builds, embeds and loads Rewrity's style corpus"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "certifi>=2024",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Does not rely on the editable install: Python skips its .pth file when a synced folder marks it hidden
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
